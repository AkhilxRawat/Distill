name: Build Frontend Service

on:
    push:
        paths:
            - 'frontend/**'
          
jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                file: frontend/Dockerfile
                push: true
                tags: |
                    ghcr.io/akhilxrawat/distill-frontend:dev-${{ github.sha }}

            - name: Update dev image tag and commit
              run: |
                  yq -i '.image.tag = "dev-${{ github.sha }}"' charts/frontend/values/dev.yaml
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add charts/frontend/values/dev.yaml
                  git commit -m "chore(frontend): deploy dev-${{ github.sha }} to dev [skip ci]"
                  for i in 1 2 3; do
                    git pull --rebase origin main && git push && break
                    sleep 3
                  done
