name: Build Processing Service
on:
   push:
    paths:
        - 'services/processing/**'
        - 'proto/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
        contents: write
        packages: write
    steps:
        - name: Checckout repository
          uses: actions/checkout@v4
        -  name: Log in to GHCR
           uses: docker/login-action@v3
           with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: services/processing/Dockerfile
            push: true
            tags: |
                 ghcr.io/akhilxrawat/distill-processing:dev-${{ github.sha }}

        - name: Update dev image tag and commit
          run: |
              yq -i '.image.tag = "dev-${{ github.sha }}"' charts/processing/values/dev.yaml
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add charts/processing/values/dev.yaml
              git commit -m "chore(processing): deploy dev-${{ github.sha }} to dev [skip ci]"
              for i in 1 2 3; do
                git pull --rebase origin main && git push && break
                sleep 3
              done
