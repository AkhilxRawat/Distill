name: Promote to main

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to promote (or "all")'
        required: true
        type: choice
        options:
          - all
          - gateway
          - frontend
          - ingestion
          - processing
          - storage

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote dev image(s) to prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          services="${{ github.event.inputs.service }}"
          if [ "$services" = "all" ]; then
            services="gateway frontend ingestion processing storage"
          fi

          for svc in $services; do
            dev_tag=$(yq '.image.tag' "charts/$svc/values/dev.yaml")
            # dev_tag looks like "dev-<sha>" — reuse the same sha, just
            # relabel it as "prod-<sha>". This retags the exact same
            # image already tested in dev — it does NOT rebuild it.
            sha="${dev_tag#dev-}"
            prod_tag="prod-${sha}"
            image="ghcr.io/akhilxrawat/distill-${svc}"

            docker buildx imagetools create -t "${image}:${prod_tag}" "${image}:${dev_tag}"

            yq -i ".image.tag = \"${prod_tag}\"" "charts/$svc/values/prod.yaml"
            git add "charts/$svc/values/prod.yaml"
          done

          if git diff --staged --quiet; then
            echo "Nothing to promote — prod already matches dev for: ${services}"
            exit 0
          fi

          git commit -m "chore: promote ${services} to main [skip ci]"

          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 3
          done
