apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Release name "distill-mongodb-main" — matches the connection string
  # already set in charts/storage/values/prod.yaml
  # (distill-mongodb-main-0/-1/-arbiter.distill-main.svc...). Same chart
  # as dev's distill-mongodb, just a different namespace/release name —
  # the chart templates are namespace-agnostic (.Release.Namespace).
  name: distill-mongodb-main
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AkhilxRawat/Distill
    targetRevision: main
    path: charts/mongodb
  destination:
    server: https://kubernetes.default.svc
    namespace: distill-main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: distill-tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.10.1
    helm:
      values: |
        tempo:
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
                grpc:
                  endpoint: 0.0.0.0:4317
          metricsGenerator:
            enabled: true
            remoteWriteUrl: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write
        serviceMonitor:
          enabled: true
          labels:
            release: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.1
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true      # CRDs are large; avoids client-side apply size limits

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AkhilxRawat/Distill
    targetRevision: main
    path: charts/metallb-config
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        maxDuration: 3m
        factor: 2
