# 1. Bootstrap self-signed issuer — only used to sign the root CA below
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
# 2. Root CA certificate, signed by the bootstrap issuer, stored in cert-manager namespace
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: distill-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: distill-internal-ca
  secretName: distill-ca-secret
  duration: 87600h        # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
# 3. The CA issuer that signs all your service certs from the root CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: distill-ca-issuer
spec:
  ca:
    secretName: distill-ca-secret
