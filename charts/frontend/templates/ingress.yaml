{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Same-origin proxy: the frontend calls /api/* and /ws as relative
          # paths (see frontend/src/lib/api.ts), so route those to the gateway
          # here — the equivalent of nginx/nginx.conf in the compose setup.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.gatewayService }}
                port:
                  number: {{ .Values.ingress.gatewayPort }}
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.gatewayService }}
                port:
                  number: {{ .Values.ingress.gatewayPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
{{- end }}
