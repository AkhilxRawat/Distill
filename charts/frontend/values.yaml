replicaCount: 1

image:
  repository: ghcr.io/akhilxrawat/distill-frontend
  tag: "14f9ba2f2dc62bd6509dfdb3e5b1efbb87d96d12"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  host: app.distill
  # /api and /ws on this host are proxied to the gateway Service (see
  # templates/ingress.yaml). Release name of charts/gateway in this namespace.
  gatewayService: distill-gateway-main
  gatewayPort: 3000
  annotations:
    cert-manager.io/cluster-issuer: distill-ca-issuer
    # Keep long-lived /ws job-stream connections from being cut at 60s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    - hosts:
        - app.distill
      secretName: distill-frontend-tls

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 200m

# The frontend makes same-origin relative API calls (baseURL unset), so no
# NEXT_PUBLIC_API_URL is needed — and it would be baked at build time anyway,
# not read from here.
env: {}
