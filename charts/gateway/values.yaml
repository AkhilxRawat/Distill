replicaCount: 1

image:
  repository: ghcr.io/akhilxrawat/distill-gateway
  tag: "6056736cdadd3dc6a977a86152b094c4860b0a99"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

serviceMonitor:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: api.distill
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
    nginx.ingress.kubernetes.io/websocket-services: gateway
  tls:
    - hosts:
        - api.distill
      secretName: distill-gateway-tls

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 200m

env:
  INGESTION_HOST: ingestion.distill-dev.svc.cluster.local
  INGESTION_PORT: "50051"
  STORAGE_HOST: storage.distill-dev.svc.cluster.local
  STORAGE_PORT: "50053"
  JWT_SECRET: "distill-secret-change-me"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.observability.svc.cluster.local:4318"
