apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .Values.poolName }}
  namespace: metallb-system
spec:
  addresses:
    {{- toYaml .Values.addresses | nindent 4 }}
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .Values.poolName }}-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - {{ .Values.poolName }}
  interfaces:
    - eth1