apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-arbiter
  labels: { app: mongodb-arbiter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongodb-arbiter }
  template:
    metadata:
      labels: { app: mongodb-arbiter }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: [application]
      containers:
        - name: mongodb-arbiter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["mongod", "--replSet", "{{ .Values.replicaSetName }}", "--bind_ip_all"]
          ports:
            - containerPort: 27017
          resources:
            {{- toYaml .Values.arbiter.resources | nindent 12 }}
          livenessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-arbiter
  labels: { app: mongodb-arbiter }
spec:
  selector: { app: mongodb-arbiter }
  ports:
    - name: mongodb
      port: {{ .Values.service.port }}
      targetPort: 27017
