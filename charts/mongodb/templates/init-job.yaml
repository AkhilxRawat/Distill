apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-init
  labels: { app: mongodb-init }
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mongo-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - bash
            - -c
            - |
              sleep 10
              mongosh --host {{ .Release.Name }}-0.{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:27017 --eval '
                try {
                  rs.status();
                  print("Replica set already initiated, skipping.");
                } catch (e) {
                  rs.initiate({
                    _id: "{{ .Values.replicaSetName }}",
                    members: [
                      {{- range $i := until (int .Values.replicaCount) }}
                      { _id: {{ $i }}, host: "{{ $.Release.Name }}-{{ $i }}.{{ $.Release.Name }}.{{ $.Release.Namespace }}.svc.cluster.local:27017" },
                      {{- end }}
                      { _id: {{ .Values.replicaCount }}, host: "{{ .Release.Name }}-arbiter.{{ .Release.Namespace }}.svc.cluster.local:27017", arbiterOnly: true }
                    ]
                  });
                  print("Replica set initiated.");
                }
              '
