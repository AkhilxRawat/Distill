replicaCount: 2

image:
  repository: mongo
  tag: "7"
  pullPolicy: IfNotPresent

replicaSetName: rs0

service:
  port: 27017

persistence:
  enabled: true
  size: 1Gi
  storageClassName: standard

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

arbiter:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
