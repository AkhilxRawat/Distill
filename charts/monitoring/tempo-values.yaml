# Extracted verbatim from charts/argocd/applications.yaml's distill-tempo
# Application (which is never actually reconciled since ArgoCD isn't
# installed in this cluster) so it can be applied directly via `helm install`.
tempo:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write
    processor:
      local_blocks:
        flush_to_storage: true
  # Chart auto-populates service-graphs + span-metrics once metricsGenerator
  # is enabled, but not local-blocks — that's the processor that powers
  # TraceQL metrics (Grafana's Traces Drilldown app needs it; without it
  # you get "TraceQL metrics not configured").
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks
serviceMonitor:
  enabled: true
  labels:
    release: monitoring
