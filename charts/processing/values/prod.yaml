replicaCount: 1
image:
  tag: "latest" # placeholder — must be set via the promote workflow before this is used for real
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Base values.yaml points STORAGE_HOST at storage.distill-dev; in prod
# storage runs in this same namespace, addressed by release name.
env:
  STORAGE_HOST: distill-storage-main
