replicaCount: 1

image:
  repository: ghcr.io/akhilxrawat/distill-storage
  tag: "6056736cdadd3dc6a977a86152b094c4860b0a99"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 50053

serviceMonitor:
  enabled: true

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 200m

# MONGODB_URI is intentionally NOT set here — it must point at a
# different namespace's MongoDB replica set per environment, and is
# set explicitly in values/dev.yaml and values/prod.yaml instead.
# (Previously hardcoded to distill-dev here, which meant distill-main's
# storage would have silently connected to dev's database.)
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.observability.svc.cluster.local:4318"
