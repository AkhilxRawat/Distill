# ============================================================
# charts/vault/vault-static-secret-main.yaml
#
# VaultStaticSecret for distill-main (prod). Reads from
# secret/distill/processing-main — a SEPARATE Vault KV path from
# dev's secret/distill/processing, so prod credentials are never
# mixed with dev's.
#
# Materialises Kubernetes Secret "processing-secret" in
# distill-main, which charts/processing/values.yaml already
# references via envFrom.secretRef — no chart changes needed.
# ============================================================
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: processing-secret-sync
  namespace: distill-main
spec:
  vaultAuthRef: distill-vault-auth
  type: kv-v2
  mount: secret
  path: distill/processing-main
  refreshAfter: 60s

  destination:
    name: processing-secret
    create: true
    labels:
      app: distill
      component: processing
      managed-by: vault-secrets-operator
