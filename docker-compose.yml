services:
  mongodb:
    image: mongo:7
    networks:
      - backend
    volumes:
      - mongo_data:/data/db

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    networks:
      - backend
      - observability
    environment:
      - STORAGE_HOST=storage
      - STORAGE_PORT=50053
      - PROCESSING_HOST=processing
      - PROCESSING_PORT=50052
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    depends_on:
      - mongodb
      - storage
      - processing

  processing:
    build:
      context: .
      dockerfile: services/processing/Dockerfile
    networks:
      - backend
      - observability
    environment:
      - STORAGE_HOST=storage
      - STORAGE_PORT=50053
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    depends_on:
      - mongodb
      - storage

  storage:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    networks:
      - backend
      - observability
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/distill
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    depends_on:
      - mongodb

  gateway:  
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    networks:
      - public
      - backend
      - observability
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - INGESTION_HOST=ingestion
      - INGESTION_PORT=50051
      - STORAGE_HOST=storage
      - STORAGE_PORT=50053
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    depends_on:
      - ingestion
      - storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks:
      - public
    ports:
      - "127.0.0.1:4000:3000"
    depends_on:
      - gateway

  nginx:
    image: nginx:alpine
    networks:
      - public
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - frontend

networks:
  public:
  backend:
  observability:

volumes:
  mongo_data:
