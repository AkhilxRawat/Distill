scrape_configs:
  - job_name: 'distill-gateway'
    static_configs:
      - targets: ['gateway:9091', 'host.docker.internal:9091', 'localhost:9091']
  - job_name: 'distill-ingestion'
    static_configs:
      - targets: ['ingestion:9092', 'host.docker.internal:9092', 'localhost:9092']
  - job_name: 'distill-processing'
    static_configs:
      - targets: ['processing:9093', 'host.docker.internal:9093', 'localhost:9093']
  - job_name: 'distill-storage'
    static_configs:
      - targets: ['storage:9094', 'host.docker.internal:9094', 'localhost:9094']
